
services:
   db:
      # Needs a daten image that carries pgvector (`jhnnsrs/daten:next` does since
      # 2026-09-20). dokker pulls the stack before every run, so to test against a local
      # build tag it differently and point DATEN_IMAGE at it.
      image: ${DATEN_IMAGE:-jhnnsrs/daten:next}
      # Throwaway test DB: trade durability for speed (flush/TRUNCATE per test)
      command: postgres -c fsync=off -c synchronous_commit=off -c full_page_writes=off
      environment:
         POSTGRES_MULTIPLE_DATABASES: testdb
         POSTGRES_PASSWORD: test
         POSTGRES_USER: test
      labels:
         - fakts.service=live.arkitekt.postgres
      ports:
        - 5555:5432
   redis:
      environment:
         REDIS_HOST: redis
         REDIS_PORT: 6379
      image: redis
      ports:
         - 6666:6379
